name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy .

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python-version: "3.11" }
          - { os: ubuntu-latest,  python-version: "3.12" }
          - { os: ubuntu-latest,  python-version: "3.14" }
          # Windows: the lock must install (uvloop marker) and closed ports
          # must be classified correctly (SIO_TCP_INITIAL_RTO).
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.14" }
    env:
      # Browser tests run in the e2e job; here they skip.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v -rs

  e2e:
    name: e2e (Chromium)
    runs-on: ubuntu-latest
    env:
      LUKITA_E2E_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser tests (server on 127.0.0.1 only)
        run: python -m pytest -v -m e2e

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - name: Audit locked dependencies
        run: |
          pip-audit --require-hashes -r requirements.txt
          pip-audit --require-hashes -r requirements-dev.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check ES modules
        run: for f in frontend/*.js; do node --check "$f"; done
      - name: Run unit tests
        run: node --test 'frontend/tests/*.test.mjs'

  docker:
    name: docker (lite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lite image (no Chromium)
        run: docker build --build-arg WITH_SCREENSHOTS=false -t lukitaport:ci .
      - name: Refuses to start without a token
        run: |
          if docker run --rm lukitaport:ci; then
            echo "container started without LUKITA_API_TOKEN" && exit 1
          fi
      - name: Starts with a token and answers /api/health
        run: |
          docker run -d --name lp -p 127.0.0.1:8000:8000 \
            -e LUKITA_API_TOKEN=ci-token-0123456789abcdef lukitaport:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"ok":true'
          # The API itself requires the token.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/config)" = "401"
          docker inspect --format '{{.Config.User}}' lp | grep -q lukita
      - name: Container logs
        if: always()
        run: docker logs lp || true

  docker-full:
    name: docker (full, with Chromium)
    runs-on: ubuntu-latest
    env:
      TOKEN: ci-token-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Build full image
        run: docker build -t lukitaport:full .
      - name: Run hardened like docker-compose.yml
        run: |
          # Same restrictions as the compose file.  ALLOW_PRIVATE_IPS lets the
          # screenshot target a web server on the container's own 127.0.0.1.
          docker run -d --name lpf -p 127.0.0.1:8000:8000 \
            --read-only --tmpfs /tmp:size=256m --shm-size 256m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e LUKITA_API_TOKEN=$TOKEN -e ALLOW_PRIVATE_IPS=true \
            lukitaport:full
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          docker logs lpf 2>&1 | grep -q '"playwright_ready"'
      - name: Real screenshot of a page served inside the container
        run: |
          docker exec -d lpf python -m http.server 8081 --bind 127.0.0.1 --directory /app/frontend
          sleep 2
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" \
            "http://127.0.0.1:8000/api/screenshot/capture?target=127.0.0.1&port=8081"
          for i in $(seq 1 30); do
            code=$(curl -s -o shot.png -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
                   "http://127.0.0.1:8000/api/screenshot?target=127.0.0.1")
            [ "$code" = "200" ] && break
            sleep 2
          done
          test "$code" = "200"
          # PNG signature
          test "$(head -c 8 shot.png | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a"
          ls -l shot.png
      - name: Container logs
        if: always()
        run: docker logs lpf || true
