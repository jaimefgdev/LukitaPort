[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lukitaport"
version = "2.1.0"
description = "Async TCP port scanner with a web UI, HTTP/TLS auditing and CVE lookup — for authorised, educational use."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "jaimefgdev" }]
dependencies = [
    "fastapi>=0.142",
    "starlette>=1.3.1",           # older releases have known advisories (pip-audit)
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "reportlab>=5.0",
    "cryptography>=50",
    "maxminddb>=3.2",
]

[project.optional-dependencies]
# Web screenshots.  Also needs `playwright install chromium --with-deps`.
screenshots = ["playwright>=1.63"]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "mypy>=2.3",
    "pip-audit>=2.9",
    "pip-tools>=7.6",
]

[tool.setuptools]
# Flat layout: top-level modules, no package directory.
py-modules = [
    "auditor", "cache", "config", "cve_lookup", "geoip", "limits",
    "logging_config", "main", "models", "pdf_generator", "resolver", "run",
    "safe_http", "scan_service", "scanner", "security", "settings",
    "ssl_analyzer",
]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::FutureWarning"]

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "ASYNC", "S", "RUF100"]
ignore = [
    "E221", "E241", "E272",       # column-aligned assignments are the house style
    "S101",                       # assert is fine (tests, invariants)
    "S311",                       # random is not used for security
    "S603", "S607",               # subprocess with fixed argv (ping/nmap), by design
    "UP007", "UP045",             # Optional[...] is used consistently
    "ASYNC109",                   # timeout params are forwarded to wait_for / httpx
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011", "ASYNC"]
"pdf_generator.py" = ["E501"]     # column-aligned ReportLab style tables

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["^tests/", "^frontend/"]
