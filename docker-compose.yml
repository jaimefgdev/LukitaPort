# ── LukitaPort — docker-compose ─────────────────────────────────────────────
# Usage:
#   export LUKITA_API_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
#   docker compose up --build
#
# Then open http://127.0.0.1:8000 and enter the token.
#
# The port is published on 127.0.0.1 only.  Inside the container the server
# listens on 0.0.0.0, so LUKITA_API_TOKEN is mandatory (compose refuses to
# start without it).

services:
  lukitaport:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lukitaport

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      LUKITA_API_TOKEN: ${LUKITA_API_TOKEN:?Set LUKITA_API_TOKEN (at least 16 characters)}
      # Host headers accepted from the browser (anti DNS-rebinding).
      LUKITA_ALLOWED_HOSTS: ${LUKITA_ALLOWED_HOSTS:-127.0.0.1,localhost}
      ALLOW_PRIVATE_IPS: ${ALLOW_PRIVATE_IPS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Optional local GeoIP: mount the .mmdb files and set the paths, e.g.
      # LUKITA_GEOIP_DB: /geoip/GeoLite2-City.mmdb

    # Least privilege: connect scans (-sT) and unprivileged ICMP need no
    # capabilities; the filesystem is read-only except for /tmp.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m

    # Chromium needs a larger /dev/shm
    shm_size: "256m"

    restart: unless-stopped

    # The UI page is public (the API is not), so it works as a health check.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # volumes:
    #   - ./geoip:/geoip:ro      # GeoLite2 databases (optional)
